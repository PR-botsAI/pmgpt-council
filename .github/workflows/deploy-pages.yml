name: Validate static Agent Arena

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify required files
        run: |
          test -f index.html
          test -f assets/styles.css
          test -f assets/app.js
          test -f .nojekyll
          echo "Agent Arena static files are ready for GitHub Pages branch deployment."
